# Match Caddy's forwarded scheme without relying on the client's Host header.
map $http_x_forwarded_proto $laravel_https {
    default "";
    https "on";
}
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    server_tokens off;
    charset utf-8;
    client_max_body_size 20m;
    add_header X-Content-Type-Options "nosniff" always;

    # Public uploads live in a named volume in production. The production
    # Nginx image is immutable and does not contain files uploaded at runtime.
    # Other storage content (logs, private files) is never exposed here.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        autoindex off;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # All routes must eventually reach a single PHP front controller.
    location / { try_files $uri /index.php?$query_string; }

    location = /index.php {
        include fastcgi_params;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_backend app:9000;
        fastcgi_pass $php_backend;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS $laravel_https;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
