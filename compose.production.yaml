name: ${PROJECT_NAME:-foundry}-prod
x-app: &app
  image: ${APP_IMAGE:?APP_IMAGE must point to a published release}
  # Select secrets independently per deployment environment.
  env_file: [${APP_ENV_FILE:-./app.production.env}]
  restart: unless-stopped
  volumes:
    - app-storage:/var/www/html/storage
  depends_on:
    postgres: {condition: service_healthy}
  networks: [internal]
services:
  app:
    <<: *app
    command: php-fpm
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must point to a published release}
    restart: unless-stopped
    depends_on: [app]
    networks: [internal]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Local parity binds only loopback, public servers use 80/443.
    ports:
      - "${PUBLIC_BIND_IP:-0.0.0.0}:${PUBLIC_HTTP_PORT:-80}:80"
      - "${PUBLIC_BIND_IP:-0.0.0.0}:${PUBLIC_HTTPS_PORT:-443}:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set a public FQDN}
      LOCAL_DOMAIN: ${LOCAL_DOMAIN:-foundry-parity.test}
    volumes:
      - ${CADDY_CONFIG_FILE:-./docker/caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]
    networks: [internal]
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: [${DB_ENV_FILE:-./db.production.env}]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # Credentials live in db env_file, not necessarily in Compose host env.
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 8
    networks: [internal]
  worker:
    <<: *app
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
  scheduler:
    <<: *app
    command: php artisan schedule:work
networks:
  internal:
volumes:
  pgdata:
  app-storage:
  caddy-data:
  caddy-config:
