name: Template CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unix-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate POSIX scripts
        run: sh -n scripts/bootstrap.sh scripts/checkout-starter.sh scripts/configure-app.sh scripts/setup.sh scripts/npm-ensure.sh scripts/backup.sh scripts/destroy.sh
      - name: Enforce Sail-free generated applications
        run: |
          if [ -f app/composer.json ] && grep -Eq '"laravel/sail"[[:space:]]*:' app/composer.json; then
            echo "laravel/sail is prohibited by this Docker-first template."
            exit 1
          fi
          if [ -f app/composer.lock ] && grep -q '"name": "laravel/sail"' app/composer.lock; then
            echo "Remove laravel/sail from composer.lock."
            exit 1
          fi
      - name: Validate Make recipes
        run: make -n setup STARTER=svelte && make -n backup && make -n destroy
      - name: Ensure the template has no tracked application
        run: |
          if git ls-files app/ | grep -q .; then
            echo "Generated app/ must not be committed to the template."
            exit 1
          fi
          git check-ignore app/artisan
      - name: Ensure the wizard precedes starter checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for script, wizard, bootstrap in [
              ('scripts/setup.sh', 'wizard.php', 'bootstrap.sh'),
              ('scripts/setup.ps1', 'wizard.php', 'bootstrap.ps1'),
          ]:
              contents = Path(script).read_text()
              assert contents.index(wizard) < contents.index(bootstrap), script
          print('Wizard runs before bootstrap in both platforms')
          PY
      - name: Validate shared PHP wizard
        run: |
          php -l scripts/wizard.php
          php -l scripts/configure-app.php
      - name: Validate Compose
        run: docker compose config -q
      - name: Build and smoke-test PHP development toolchain
        run: |
          docker compose build app
          docker compose run --rm --no-deps --user 0:0 app sh -ec 'chown "$DEV_UID:$DEV_GID" /var/www/html/node_modules /tmp/npm-cache /tmp/composer'
          docker compose run --rm --no-deps app sh -ec 'php -v && composer --version && node --version && npm --version && touch /var/www/html/node_modules/.cache-write-test && touch /tmp/npm-cache/.cache-write-test && touch /tmp/composer/.cache-write-test'
      - name: Forbid attribute-preserving copy onto Docker Desktop bind mounts
        run: |
          if grep -Eq '^[[:space:]]*cp[[:space:]]+-a([[:space:]]|$)' scripts/checkout-starter.sh; then
            echo 'Use cp -R without -a; Docker Desktop may refuse metadata operations.'
            exit 1
          fi
      - name: Test starter checkout with the mounted node_modules directory
        run: |
          docker compose run --rm --no-deps --entrypoint sh app -ec '
            repo=$(mktemp -d /tmp/letsgo-repo.XXXXXX)
            git init -q -b main "$repo"
            git -C "$repo" config user.name CI
            git -C "$repo" config user.email ci@example.invalid
            printf "#!/usr/bin/env php\n" > "$repo/artisan"
            printf "{}\n" > "$repo/composer.json"
            git -C "$repo" add .
            git -C "$repo" commit -qm fixture
            test -d /var/www/html/node_modules
            sh /opt/letsgo/checkout-starter.sh main "$repo"
            test -f /var/www/html/artisan
            test -d /var/www/html/node_modules
            test ! -e /var/www/html/.git
          '
      - name: Verify shared dependencies and matching Linux libc
        run: |
          docker compose --profile dev run --rm --no-deps --entrypoint sh node -ec 'node --version && npm --version && test -f /var/www/html/node_modules/.cache-write-test && test -f /tmp/npm-cache/.cache-write-test'
  powershell-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all native Windows scripts
        shell: powershell
        run: |
          $scripts = Get-ChildItem scripts -Filter '*.ps1'
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($script.Name): $_" }
              exit 1
            }
            Write-Host "Parsed: $($script.Name)"
          }
      - name: Verify native Windows Make dispatch
        shell: powershell
        run: |
          choco install make -y --no-progress
          $dryRun = & make -n setup STARTER=svelte 2>&1 | Out-String
          Write-Host $dryRun
          if ($dryRun -notmatch 'powershell.exe' -or $dryRun -match '^sh scripts/setup.sh') { throw 'Windows setup must use PowerShell, not sh' }
