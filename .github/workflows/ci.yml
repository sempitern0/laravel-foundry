name: Template CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unix-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate POSIX scripts
        run: sh -n scripts/bootstrap.sh scripts/configure-app.sh scripts/setup.sh scripts/npm-ensure.sh scripts/backup.sh scripts/destroy.sh
      - name: Enforce Sail-free generated applications
        run: |
          if [ -f app/composer.json ] && grep -Eq '"laravel/sail"[[:space:]]*:' app/composer.json; then
            echo "laravel/sail is prohibited by this Docker-first template."
            exit 1
          fi
          if [ -f app/composer.lock ] && grep -q '"name": "laravel/sail"' app/composer.lock; then
            echo "Remove laravel/sail from composer.lock."
            exit 1
          fi
      - name: Validate Make recipes
        run: make -n setup STARTER=svelte && make -n backup && make -n destroy
      - name: Ensure the template has no tracked application
        run: |
          if git ls-files app/ | grep -q .; then
            echo "Generated app/ must not be committed to the template."
            exit 1
          fi
          git check-ignore app/artisan
      - name: Validate Compose
        run: docker compose config -q
      - name: Build and smoke-test PHP development toolchain
        run: |
          docker compose build app
          docker compose run --rm --no-deps --user 0:0 app sh -ec 'chown "$DEV_UID:$DEV_GID" /var/www/html/node_modules /tmp/npm-cache /tmp/composer'
          docker compose run --rm --no-deps app sh -ec 'php -v && composer --version && node --version && npm --version && touch /var/www/html/node_modules/.cache-write-test && touch /tmp/npm-cache/.cache-write-test && touch /tmp/composer/.cache-write-test'
      - name: Verify shared dependencies and matching Linux libc
        run: |
          docker compose --profile dev run --rm --no-deps --entrypoint sh node -ec 'node --version && npm --version && test -f /var/www/html/node_modules/.cache-write-test && test -f /tmp/npm-cache/.cache-write-test'
  powershell-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all native Windows scripts
        shell: powershell
        run: |
          $scripts = Get-ChildItem scripts -Filter '*.ps1'
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($script.Name): $_" }
              exit 1
            }
            Write-Host "Parsed: $($script.Name)"
          }
      - name: Verify native Windows Make dispatch
        shell: powershell
        run: |
          choco install make -y --no-progress
          $dryRun = & make -n setup STARTER=svelte 2>&1 | Out-String
          Write-Host $dryRun
          if ($dryRun -notmatch 'powershell.exe' -or $dryRun -match '^sh scripts/setup.sh') { throw 'Windows setup must use PowerShell, not sh' }
