name: Build release images
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure application was initialized and committed
        run: |
          test -f app/artisan && test -f app/composer.lock && test -f app/package-lock.json || {
            echo "Generate and commit a Laravel starter with make setup before releasing."
            exit 1
          }
      - name: Enforce Sail-free app
        run: |
          if grep -Eq '"laravel/sail"[[:space:]]*:' app/composer.json; then
            echo "Remove Laravel Sail from composer.json before releasing."
            exit 1
          fi
          if grep -q '"name": "laravel/sail"' app/composer.lock; then
            echo "Remove Laravel Sail from composer.lock before releasing."
            exit 1
          fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, intl, zip, bcmath, gd
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install PHP dependencies
        working-directory: app
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Build assets for selected Laravel starter
        working-directory: app
        run: npm ci && npm run build
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Production.Dockerfile
          target: production
          push: true
          tags: ghcr.io/${{ github.repository }}-php:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-web:${{ github.ref_name }}
