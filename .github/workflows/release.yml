name: Build release images
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  release:
    if: hashFiles('app/artisan', 'app/composer.lock', 'app/package-lock.json') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, intl, zip, bcmath, gd
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install backend dependencies
        working-directory: app
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Build Svelte assets
        working-directory: app
        run: npm ci && npm run build
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: production
          push: true
          tags: ghcr.io/${{ github.repository }}-php:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-web:${{ github.ref_name }}
