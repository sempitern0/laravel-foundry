name: ${PROJECT_NAME:-letsgo}
# PHP-FPM runtime deliberately does not have Composer or Node.
x-runtime: &runtime
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: development
  user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
  working_dir: /var/www/html
  volumes:
    - ./app:/var/www/html
  environment:
    APP_ENV: local
  networks: [internal]
# Laravel Composer hooks may invoke npm, so the disposable tooling target
# contains PHP (matching runtime extensions), Composer and Node/npm.
x-tooling: &tooling
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: tooling
  user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
  working_dir: /var/www/html
  volumes:
    - ./app:/var/www/html
    - ./scripts:/opt/letsgo:ro
    - ./:/workspace
    - node_modules:/var/www/html/node_modules
    - npm_cache:/tmp/npm-cache
    - composer_home:/tmp/composer
  environment:
    APP_ENV: local
    HOME: /tmp
    COMPOSER_HOME: /tmp/composer
    DEV_UID: ${DEV_UID:-1000}
    DEV_GID: ${DEV_GID:-1000}
    npm_config_cache: /tmp/npm-cache
    npm_config_prefer_offline: "true"
    npm_config_audit: "false"
    npm_config_fund: "false"
    npm_config_progress: "false"
  networks: [internal, devtools]
services:
  app:
    <<: *runtime
    command: php-fpm
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      # Fast startup detection without continuously polling every 2 seconds.
      start_period: 45s
      start_interval: 2s
      interval: 30s
      retries: 3
      timeout: 3s
  composer:
    <<: *tooling
    profiles: [tools]
    command: ["composer", "--version"]
  web:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:80"]
    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      start_period: 45s
      start_interval: 2s
      interval: 30s
      retries: 3
      timeout: 3s
    networks: [internal]
  caddy-local:
    image: caddy:2-alpine
    profiles: [https]
    ports: ["127.0.0.1:${HTTPS_PORT:-443}:443"]
    environment:
      LOCAL_DOMAIN: ${LOCAL_DOMAIN:-letsgo.test}
    volumes:
      - ./docker/caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_local_data:/data
      - caddy_local_config:/config
    depends_on:
      web: {condition: service_healthy}
    networks: [internal]
  node:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: frontend
    profiles: [dev]
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    working_dir: /var/www/html
    command: sh -c "npm run dev -- --host 0.0.0.0"
    environment:
      APP_ENV: local
      HOME: /tmp
      npm_config_cache: /tmp/npm-cache
      npm_config_prefer_offline: "true"
      npm_config_audit: "false"
      npm_config_fund: "false"
      npm_config_progress: "false"
    volumes:
      - ./app:/var/www/html
      - node_modules:/var/www/html/node_modules
      - npm_cache:/tmp/npm-cache
      - ./scripts/npm-ensure.sh:/opt/letsgo/npm-ensure.sh:ro
    ports: ["127.0.0.1:${VITE_PORT:-5173}:5173"]
    # Wayfinder can invoke Artisan and needs optional DB access.
    networks: [internal, devtools]
  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    environment:
      POSTGRES_DB: ${DB_DATABASE:-letsgo}
      POSTGRES_USER: ${DB_USERNAME:-letsgo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-letsgo} -d ${DB_DATABASE:-letsgo}"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [internal]
  mariadb:
    image: mariadb:11.8
    profiles: [mariadb]
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-letsgo}
      MARIADB_USER: ${DB_USERNAME:-letsgo}
      MARIADB_PASSWORD: ${DB_PASSWORD:-local-only-change-me}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-only-root-change-me}
    volumes: [mariadb_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 18
      timeout: 5s
    networks: [internal]
  redis:
    image: redis:7-alpine
    profiles: [redis]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    networks: [internal]
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [mailpit]
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
    networks: [internal]
  pgweb:
    image: sosedoff/pgweb:0.16.2
    profiles: [pgweb]
    environment:
      PGWEB_DATABASE_URL: "postgres://${DB_USERNAME:-letsgo}:${DB_PASSWORD:-local-only-change-me}@postgres:5432/${DB_DATABASE:-letsgo}?sslmode=disable"
    ports: ["127.0.0.1:${DB_UI_PORT:-8081}:8081"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal]
  adminer:
    image: adminer:5
    profiles: [adminer]
    environment:
      ADMINER_DEFAULT_SERVER: ${DB_SERVER:-mariadb}
    ports: ["127.0.0.1:${DB_UI_PORT:-8081}:8080"]
    networks: [internal]
  worker:
    <<: *runtime
    profiles: [workers]
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
  scheduler:
    <<: *runtime
    profiles: [scheduler]
    restart: unless-stopped
    command: php artisan schedule:work
networks:
  internal:
  # Downloads require egress. Neither network is a full security boundary.
  devtools:
volumes:
  pgdata:
  mariadb_data:
  redisdata:
  node_modules:
  npm_cache:
  composer_home:
  caddy_local_data:
  caddy_local_config:
