name: ${PROJECT_NAME:-letsgo}
x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: development
  user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
  working_dir: /var/www/html
  volumes:
    - ./app:/var/www/html
    # Avoid thousands of small filesystem writes through a Windows bind mount.
    # Both PHP (Composer hooks) and the Vite service use the same Linux deps.
    - node_modules:/var/www/html/node_modules
    - npm_cache:/tmp/npm-cache
    - composer_home:/tmp/composer
  environment:
    APP_ENV: local
    HOME: /tmp
    COMPOSER_HOME: /tmp/composer
    DEV_UID: ${DEV_UID:-1000}
    DEV_GID: ${DEV_GID:-1000}
    npm_config_cache: /tmp/npm-cache
    npm_config_prefer_offline: "true"
    npm_config_audit: "false"
    npm_config_fund: "false"
    npm_config_progress: "false"
  depends_on:
    postgres:
      condition: service_healthy
  networks: [internal]
services:
  app:
    <<: *app
    command: php-fpm
  web:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:80"]
    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [internal]
  node:
    # Match PHP's Debian/glibc environment for native npm dependencies.
    image: node:22-bookworm-slim
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    working_dir: /var/www/html
    command: sh -c "npm run dev -- --host 0.0.0.0"
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/npm-cache
      npm_config_prefer_offline: "true"
      npm_config_audit: "false"
      npm_config_fund: "false"
      npm_config_progress: "false"
    volumes:
      - ./app:/var/www/html
      - node_modules:/var/www/html/node_modules
      - npm_cache:/tmp/npm-cache
      - ./scripts/npm-ensure.sh:/opt/letsgo/npm-ensure.sh:ro
    ports: ["127.0.0.1:${VITE_PORT:-5173}:5173"]
    profiles: [dev]
    networks: [internal]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-letsgo}
      POSTGRES_USER: ${DB_USERNAME:-letsgo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-letsgo} -d ${DB_DATABASE:-letsgo}"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [internal]
  redis:
    image: redis:7-alpine
    profiles: [redis]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    networks: [internal]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
    networks: [internal]
  worker:
    <<: *app
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    profiles: [workers]
    restart: unless-stopped
  scheduler:
    <<: *app
    command: php artisan schedule:work
    profiles: [workers]
    restart: unless-stopped
networks:
  internal:
volumes:
  pgdata:
  redisdata:
  node_modules:
  npm_cache:
  composer_home:
